<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Catálogo de productos de El Bolsillo Mágico 3D">
<title>Catálogo | El Bolsillo Mágico 3D</title>

<style>
:root{
  --green:#173b00;
  --green-dark:#0d2500;
  --green-light:#2f650d;
  --cream:#f7f6f0;
  --white:#ffffff;
  --text:#171b15;
  --muted:#70776c;
  --line:#e2e5de;
  --red:#b3261e;
  --radius:20px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--cream);
  color:var(--text);
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(
    135deg,
    var(--green-dark),
    var(--green)
  );
  color:white;
  box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.logo-text{
  font-weight:800;
  font-size:18px;
}

.logo-sub{
  font-size:12px;
  opacity:.75;
  margin-top:3px;
}

.header-button{
  border:1px solid rgba(255,255,255,.25);
  color:white;
  text-decoration:none;
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
  transition:.2s;
}

.header-button:hover{
  background:rgba(255,255,255,.12);
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:45px 20px 25px;
  text-align:center;
}

.badge{
  display:inline-block;
  background:#e3eddc;
  color:var(--green);
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:14px;
}

.hero h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
  line-height:1.05;
}

.hero p{
  max-width:650px;
  margin:14px auto 0;
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
}

/* BUSCADOR */

.controls{
  max-width:1200px;
  margin:10px auto 30px;
  padding:0 20px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  padding:17px 18px 17px 48px;
  border:1px solid var(--line);
  border-radius:16px;
  background:white;
  font-size:16px;
  outline:none;
  transition:.2s;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.search-box input:focus{
  border-color:var(--green-light);
  box-shadow:0 0 0 3px rgba(47,101,13,.12);
}

.search-icon{
  position:absolute;
  left:17px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
}

/* ESTADO */

.status{
  max-width:1200px;
  margin:0 auto 20px;
  padding:0 20px;
  color:var(--muted);
  font-size:14px;
}

/* GRID */

.products{
  max-width:1200px;
  margin:auto;
  padding:0 20px 60px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

/* TARJETA */

.product-card{
  background:white;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
  transition:
    transform .2s,
    box-shadow .2s;
  display:flex;
  flex-direction:column;
}

.product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.10);
}

.product-image{
  width:100%;
  aspect-ratio:1/1;
  background:#f0f1ed;
  position:relative;
  overflow:hidden;
  cursor:pointer;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s;
}

.product-card:hover .product-image img{
  transform:scale(1.04);
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:40px;
}

/* BADGE DISPONIBILIDAD */

.availability{
  position:absolute;
  top:12px;
  left:12px;
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:#e5f3df;
  color:#25651b;
}

.availability.out{
  background:#f9dfdd;
  color:var(--red);
}

/* CONTENIDO */

.product-info{
  padding:17px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin:0 0 10px;
  line-height:1.25;
}

.product-description{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:15px;
}

.product-bottom{
  margin-top:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.price{
  font-size:21px;
  font-weight:900;
  color:var(--green);
}

.price small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:500;
  margin-top:2px;
}

.buy-button{
  border:0;
  background:var(--green);
  color:white;
  padding:10px 13px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.buy-button:hover{
  background:var(--green-light);
}

.buy-button:disabled{
  background:#bfc3bb;
  cursor:not-allowed;
}

/* VACÍO */

.empty{
  max-width:600px;
  margin:50px auto 80px;
  padding:30px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:50px;
  margin-bottom:15px;
}

.empty h2{
  color:var(--text);
  margin:0 0 10px;
}

/* CARGANDO */

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #dce2d8;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

.error{
  grid-column:1/-1;
  background:#fff0ef;
  border:1px solid #f0c5c1;
  color:#8d201b;
  border-radius:16px;
  padding:20px;
  text-align:center;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-content{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  position:relative;
  padding:20px;
}

.modal-close{
  position:absolute;
  right:15px;
  top:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.08);
  font-size:22px;
  cursor:pointer;
  z-index:2;
}

.modal-image{
  width:100%;
  max-height:65vh;
  object-fit:contain;
  border-radius:16px;
  background:#f2f3ef;
}

.modal-title{
  font-size:24px;
  margin:18px 0 5px;
}

.modal-price{
  color:var(--green);
  font-size:25px;
  font-weight:900;
}

/* FOOTER */

footer{
  background:var(--green-dark);
  color:white;
  text-align:center;
  padding:30px 20px;
  font-size:13px;
}

footer strong{
  display:block;
  font-size:16px;
  margin-bottom:6px;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:720px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .product-info{
    padding:13px;
  }

  .product-name{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }

  .buy-button{
    padding:9px 10px;
    font-size:12px;
  }

  .logo-text{
    font-size:15px;
  }

  .header-button{
    padding:9px 10px;
    font-size:12px;
  }
}

@media(max-width:450px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .product-bottom{
    flex-direction:column;
    align-items:stretch;
  }

  .buy-button{
    width:100%;
  }

  .price{
    text-align:left;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo-area">

      <img
        src="./assets/logo.PNG"
        alt="El Bolsillo Mágico 3D"
        onerror="this.style.display='none'"
      >

      <div>
        <div class="logo-text">
          El Bolsillo Mágico 3D
        </div>

        <div class="logo-sub">
          Catálogo de productos
        </div>
      </div>

    </div>

    <a href="./index.html" class="header-button">
      🔐 Inventario
    </a>

  </div>
</header>


<section class="hero">

  <span class="badge">
    CATÁLOGO ONLINE
  </span>

  <h1>
    Nuestros productos
  </h1>

  <p>
    Descubre todos nuestros productos disponibles.
    Consulta precios y disponibilidad de forma rápida y sencilla.
  </p>

</section>


<div class="controls">

  <div class="search-box">

    <span class="search-icon">
      🔎
    </span>

    <input
      type="search"
      id="searchInput"
      placeholder="Buscar productos..."
      autocomplete="off"
    >

  </div>

</div>


<div class="status" id="status">
  Cargando productos...
</div>


<main class="products" id="products">

  <div class="loading">

    <div class="spinner"></div>

    Cargando catálogo...

  </div>

</main>


<footer>

  <strong>
    El Bolsillo Mágico 3D
  </strong>

  Catálogo de productos

</footer>


<!-- MODAL IMAGEN -->

<div class="modal" id="imageModal">

  <div class="modal-content">

    <button
      class="modal-close"
      id="closeModal"
      aria-label="Cerrar"
    >
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt=""
    >

    <h2
      id="modalTitle"
      class="modal-title"
    ></h2>

    <div
      id="modalPrice"
      class="modal-price"
    ></div>

  </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyArKREs5r_6zt5FpiJn9m2Tb-J9XkitzQI",

  authDomain: "mi-inventario-f03bf.firebaseapp.com",

  projectId: "mi-inventario-f03bf",

  storageBucket: "mi-inventario-f03bf.firebasestorage.app",

  messagingSenderId: "214570994765",

  appId: "1:214570994765:web:0d31eedd1cfd69e1636004"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================================
   ELEMENTOS
========================================================= */

const productsContainer =
  document.getElementById("products");

const status =
  document.getElementById("status");

const searchInput =
  document.getElementById("searchInput");

const imageModal =
  document.getElementById("imageModal");

const modalImage =
  document.getElementById("modalImage");

const modalTitle =
  document.getElementById("modalTitle");

const modalPrice =
  document.getElementById("modalPrice");

const closeModal =
  document.getElementById("closeModal");


/* =========================================================
   VARIABLES
========================================================= */

let productos = [];


/* =========================================================
   CARGAR CATÁLOGO
========================================================= */

onSnapshot(
  collection(db, "catalogo"),

  (snapshot) => {

    productos = [];

    snapshot.forEach((doc) => {

      const data = doc.data();

      productos.push({
        id: doc.id,
        ...data
      });

    });

    productos.sort((a,b) => {

      const nombreA =
        String(a.producto || "").toLowerCase();

      const nombreB =
        String(b.producto || "").toLowerCase();

      return nombreA.localeCompare(nombreB);

    });

    mostrarProductos();

  },

  (error) => {

    console.error(
      "Error cargando catálogo:",
      error
    );

    status.textContent =
      "No se ha podido cargar el catálogo.";

    productsContainer.innerHTML = `

      <div class="error">

        <strong>
          ⚠️ Error al cargar los productos
        </strong>

        <br><br>

        Comprueba las reglas de seguridad de
        Firebase y que exista la colección
        <strong>catalogo</strong>.

      </div>

    `;

  }
);


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function mostrarProductos(){

  const busqueda =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtrados =
    productos.filter((producto) => {

      const nombre =
        String(
          producto.producto || ""
        ).toLowerCase();

      const descripcion =
        String(
          producto.descripcionPublica || ""
        ).toLowerCase();

      return (
        nombre.includes(busqueda) ||
        descripcion.includes(busqueda)
      );

    });


  status.textContent =
    `${filtrados.length} producto${filtrados.length !== 1 ? "s" : ""}`;


  if(!filtrados.length){

    productsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <h2>
          No encontramos productos
        </h2>

        <p>
          Prueba con otro nombre o palabra.
        </p>

      </div>

    `;

    return;

  }


  productsContainer.innerHTML = "";


  filtrados.forEach((producto) => {

    productsContainer.appendChild(
      crearTarjeta(producto)
    );

  });

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(producto){

  const card =
    document.createElement("article");

  card.className =
    "product-card";


  const stock =
    Number(producto.stock || 0);

  const disponible =
    stock > 0;


  const nombre =
    producto.producto ||
    "Producto";


  const precio =
    Number(producto.precioVenta || 0);


  const foto =
    producto.foto || "";


  const descripcion =
    producto.descripcionPublica || "";


  let imagenHTML;


  if(foto){

    imagenHTML = `

      <img
        src="${escaparHTML(foto)}"
        alt="${escaparHTML(nombre)}"
        loading="lazy"
      >

    `;

  }else{

    imagenHTML = `

      <div class="no-image">
        📦
      </div>

    `;

  }


  card.innerHTML = `

    <div
      class="product-image"
      data-action="image"
    >

      ${imagenHTML}

      <span class="availability ${!disponible ? "out" : ""}">

        ${
          disponible
            ? "✓ Disponible"
            : "Agotado"
        }

      </span>

    </div>


    <div class="product-info">

      <h2 class="product-name">
        ${escaparHTML(nombre)}
      </h2>


      ${
        descripcion
          ? `
            <div class="product-description">
              ${escaparHTML(descripcion)}
            </div>
          `
          : ""
      }


      <div class="product-bottom">

        <div class="price">

          ${precio.toFixed(2).replace(".", ",")} €

          <small>
            IVA incluido
          </small>

        </div>


        <button
          class="buy-button"
          ${!disponible ? "disabled" : ""}
          data-action="contact"
        >

          ${
            disponible
              ? "Consultar"
              : "Agotado"
          }

        </button>

      </div>

    </div>

  `;


  /* Imagen */

  const imageArea =
    card.querySelector(
      '[data-action="image"]'
    );


  imageArea.addEventListener(
    "click",
    () => {

      if(foto){

        abrirModal(
          foto,
          nombre,
          precio
        );

      }

    }
  );


  /* Botón */

  const button =
    card.querySelector(
      '[data-action="contact"]'
    );


  if(disponible){

    button.addEventListener(
      "click",
      () => {

        mostrarMensajeConsulta(
          nombre,
          precio
        );

      }
    );

  }


  return card;

}


/* =========================================================
   BUSCADOR
========================================================= */

searchInput.addEventListener(
  "input",
  mostrarProductos
);


/* =========================================================
   MODAL
========================================================= */

function abrirModal(
  foto,
  nombre,
  precio
){

  modalImage.src = foto;

  modalImage.alt = nombre;

  modalTitle.textContent =
    nombre;

  modalPrice.textContent =
    `${precio.toFixed(2).replace(".", ",")} €`;

  imageModal.classList.add(
    "active"
  );

}


function cerrarModal(){

  imageModal.classList.remove(
    "active"
  );

  modalImage.src = "";

}


closeModal.addEventListener(
  "click",
  cerrarModal
);


imageModal.addEventListener(
  "click",
  (event) => {

    if(event.target === imageModal){

      cerrarModal();

    }

  }
);


document.addEventListener(
  "keydown",
  (event) => {

    if(event.key === "Escape"){

      cerrarModal();

    }

  }
);


/* =========================================================
   CONSULTAR PRODUCTO
========================================================= */

function mostrarMensajeConsulta(
  nombre,
  precio
){

  const texto =
    `Has seleccionado "${nombre}" por ${precio.toFixed(2).replace(".", ",")} €.`;

  alert(
    texto +
    "\n\nPuedes contactar con nosotros para realizar el pedido."
  );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escaparHTML(valor){

  return String(valor)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
