<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Catálogo online de ReBlueOutlet">
<meta name="theme-color" content="#111827">
<title>ReBlueOutlet · Catálogo</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --ok:#15803d;
  --danger:#b91c1c
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text)
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}

.wrap{
  max-width:1280px;
  margin:auto;
  padding:0 20px
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  font-size:1.25rem
}

.brand img{
  height:42px;
  width:auto;
  display:block;
  border-radius:50%
}

.brand span{
  color:#6b7280
}

.hero{
  padding:42px 0 24px
}

.hero h1{
  font-size:clamp(2rem,5vw,3.5rem);
  line-height:1;
  margin:0 0 12px;
  letter-spacing:-.055em
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:1.05rem
}

/* AVISO DE WHATSAPP */
.whatsapp-info{
  margin:0 0 24px;
  padding:14px 18px;
  background:#ecfdf3;
  border:1px solid #bbf7d0;
  border-radius:14px;
  color:#166534;
  font-size:.95rem;
  line-height:1.5
}

.whatsapp-info strong{
  font-weight:800
}

.whatsapp-info a{
  color:#15803d;
  font-weight:800;
  text-decoration:none
}

.whatsapp-info a:hover{
  text-decoration:underline
}

.controls{
  display:grid;
  grid-template-columns:minmax(240px,1fr) 180px 180px;
  gap:10px;
  margin:20px 0 26px
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  padding:0 14px;
  font:inherit;
  color:var(--text);
  outline:none
}

input:focus,
select:focus{
  border-color:#9ca3af
}

.summary{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  color:var(--muted);
  font-size:.92rem
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  padding-bottom:48px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(17,24,39,.04);
  display:flex;
  flex-direction:column
}

.photo{
  aspect-ratio:1;
  background:#eef1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.photo img{
  width:100%;
  height:100%;
  object-fit:contain
}

.placeholder{
  font-size:2rem;
  color:#9ca3af
}

.body{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1
}

.name{
  font-weight:750;
  line-height:1.25;
  min-height:2.5em
}

.ref{
  font-size:.78rem;
  color:var(--muted)
}

.bottom{
  margin-top:auto;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  padding-top:10px
}

.price{
  font-size:1.25rem;
  font-weight:900
}

.stock{
  font-size:.78rem;
  font-weight:750
}

.available{
  color:var(--ok)
}

.sold{
  color:var(--danger)
}

.empty{
  grid-column:1/-1
