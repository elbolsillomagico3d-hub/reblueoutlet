<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo online de ReBlueOutlet">
  <meta name="theme-color" content="#111827">
  <title>ReBlueOutlet · Catálogo</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#15803d;--danger:#b91c1c}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1280px;margin:auto;padding:0 20px}
    .nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:900;font-size:1.25rem;letter-spacing:-.03em}.brand span{color:#6b7280}
    .hero{padding:42px 0 24px}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:0 0 12px;letter-spacing:-.055em}
    .hero p{margin:0;color:var(--muted);font-size:1.05rem}
    .controls{display:grid;grid-template-columns:minmax(240px,1fr) 180px 180px;gap:10px;margin:20px 0 26px}
    input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font:inherit;color:var(--text);outline:none}
    input:focus,select:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.18)}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:.92rem}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:48px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(17,24,39,.04);display:flex;flex-direction:column;min-width:0}
    .photo{aspect-ratio:1/1;background:#eef1f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:contain;display:block}
    .placeholder{font-size:2rem;color:#9ca3af}
    .body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}
    .name{font-weight:750;line-height:1.25;min-height:2.5em}
    .ref{font-size:.78rem;color:var(--muted)}
    .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:10px;padding-top:10px}
    .price{font-size:1.25rem;font-weight:900}
    .stock{font-size:.78rem;font-weight:750}.available{color:var(--ok)}.sold{color:var(--danger)}
    .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
    footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.85rem}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrap{padding:0 12px}.hero{padding-top:30px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.hero h1{font-size:2.35rem}}
  </style>
</head>
<body>
<header class="top">
  <div class="wrap nav">
    <div class="brand">ReBlueOutlet <span>· Catálogo</span></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Catálogo de productos</h1>
    <p>Consulta nuestros productos, precios y disponibilidad.</p>
  </section>

  <section class="controls" aria-label="Filtros del catálogo">
    <input id="search" type="search" placeholder="Buscar por nombre o referencia…" autocomplete="off">
    <select id="stock">
      <option value="all">Todos los productos</option>
      <option value="available">En stock</option>
      <option value="sold">Agotados</option>
    </select>
    <select id="sort">
      <option value="name">Nombre A-Z</option>
      <option value="priceAsc">Precio: menor a mayor</option>
      <option value="priceDesc">Precio: mayor a menor</option>
      <option value="stock">Disponibilidad</option>
    </select>
  </section>

  <div class="summary"><span id="count">Cargando catálogo…</span><span>Precios de venta</span></div>
  <section id="grid" class="grid" aria-live="polite"></section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> ReBlueOutlet · Catálogo online</div>
</footer>

<script>
(() => {
  const euro = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const stock = document.getElementById("stock");
  const sort = document.getElementById("sort");
  const count = document.getElementById("count");
  document.getElementById("year").textContent = new Date().getFullYear();

  let products = [];

  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));

  function render(){
    const q = search.value.trim().toLowerCase();
    let list = products.filter(p => {
      const matchesText = !q || `${p.producto} ${p.codigo}`.toLowerCase().includes(q);
      const inStock = Number(p.stock) > 0;
      const matchesStock = stock.value === "all" || (stock.value === "available" && inStock) || (stock.value === "sold" && !inStock);
      return matchesText && matchesStock;
    });

    list.sort((a,b) => {
      if(sort.value === "priceAsc") return Number(a.precioVenta||0)-Number(b.precioVenta||0);
      if(sort.value === "priceDesc") return Number(b.precioVenta||0)-Number(a.precioVenta||0);
      if(sort.value === "stock") return Number(b.stock||0)-Number(a.stock||0);
      return String(a.producto||"").localeCompare(String(b.producto||""),"es",{sensitivity:"base"});
    });

    count.textContent = `${list.length} producto${list.length===1?"":"s"}`;
    if(!list.length){ grid.innerHTML = '<div class="empty">No se han encontrado productos con esos filtros.</div>'; return; }

    grid.innerHTML = list.map(p => {
      const available = Number(p.stock) > 0;
      const image = p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.producto)}" loading="lazy">` : '<div class="placeholder">📦</div>';
      return `<article class="card">
        <div class="photo">${image}</div>
        <div class="body">
          <div class="name">${esc(p.producto)}</div>
          <div class="ref">Ref. ${esc(p.codigo || "—")}</div>
          <div class="bottom">
            <div class="price">${euro.format(Number(p.precioVenta||0))}</div>
            <div class="stock ${available ? "available":"sold"}">${available ? "En stock":"Agotado"}</div>
          </div>
        </div>
      </article>`;
    }).join("");
  }

  async function init(){
    try{
      const response = await fetch("./catalogo-productos.json", {cache:"no-store"});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      products = await response.json();
      render();
    }catch(error){
      count.textContent = "Error al cargar el catálogo";
      grid.innerHTML = '<div class="empty">No se pudo cargar el catálogo. Comprueba que <strong>catalogo-productos.json</strong> esté en la raíz del repositorio.</div>';
      console.error(error);
    }
  }

  search.addEventListener("input", render);
  stock.addEventListener("change", render);
  sort.addEventListener("change", render);
  init();
})();
</script>
</body>
</html>
